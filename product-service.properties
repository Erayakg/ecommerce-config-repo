server.port=8767

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator

spring.cloud.compatibility-verifier.enabled=false

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.cloud.aws.s3.endpoint=https://s3.eu-north-1.amazonaws.com
spring.cloud.aws.region.static=eu-north-1
aws.s3.region=eu-north-1
aws.s3.bucketName=${AWS_S3_BUCKET_NAME:capsuleteam}

logging.level.root=INFO
logging.level.com.demir.ecommerce.productservice=DEBUG

logging.file.name=logs/product-service/product-service.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{correlationId:-}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{correlationId:-}] %logger{36} - %msg%n


logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
