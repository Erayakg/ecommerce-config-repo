server.port=8766

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator

spring.main.allow-bean-definition-overriding=true
spring.cloud.compatibility-verifier.enabled=false

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.expiration-minutes=20
jwt.refresh-expiration-days=7
jwt.grant_type=client_credentials
jwt.scope=openid offline_access
jwt.client_id=user-service

logging.level.root=INFO
logging.level.com.demir.ecommerce.userservice=DEBUG

logging.file.name=logs/user-service/user-service.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{correlationId:-}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{correlationId:-}] %logger{36} - %msg%n


logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
